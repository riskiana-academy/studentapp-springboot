<!DOCTYPE html>
<html>

<head>
    <title>Delete Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-4">

    <h3>Delete Student</h3>

    <div id="confirmationMessage" class="alert alert-warning mt-4">
        Loading student details...
    </div>

    <div id="actionButtons" class="d-none">
        <button type="button" class="btn btn-danger" onclick="deleteStudent()">Yes, Delete</button>
        <a href="/students.html" class="btn btn-secondary">Cancel</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const nim = urlParams.get('nim');

        if (!nim) {
            alert('No student specified');
            window.location.href = '/students.html';
        }

        // Fetch student details
        fetch(`/students/${nim}`)
            .then(response => {
                if (!response.ok) throw new Error('Failed to fetch student');
                return response.json();
            })
            .then(student => {
                const messageDiv = document.getElementById('confirmationMessage');
                messageDiv.textContent = `Are you sure you want to delete student "${student.fullName}" (NIM: ${student.nim})?`;
                document.getElementById('actionButtons').classList.remove('d-none');
            })
            .catch(error => {
                alert(error.message);
                window.location.href = '/students.html';
            });

        function deleteStudent() {
            fetch(`/students/${nim}`, {
                method: 'DELETE'
            })
                .then(response => {
                    if (response.ok) {
                        alert('Student deleted successfully!');
                        window.location.href = '/students.html';
                    } else {
                        return response.json().then(data => {
                            throw new Error(data.message || 'Failed to delete student');
                        });
                    }
                })
                .catch(error => {
                    alert(error.message);
                });
        }
    </script>

</body>

</html>
