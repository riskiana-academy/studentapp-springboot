<!DOCTYPE html>
<html>

<head>
    <title>Edit Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-4">

    <h3>Edit Student</h3>

    <form id="editStudentForm" class="mt-4" style="max-width: 500px;">
        <div class="mb-3">
            <label for="nim" class="form-label">NIM</label>
            <input type="text" class="form-control" id="nim" readonly>
        </div>
        <div class="mb-3">
            <label for="fullName" class="form-label">Full Name</label>
            <input type="text" class="form-control" id="fullName" required>
        </div>
        <div class="mb-3">
            <label for="address" class="form-label">Address</label>
            <input type="text" class="form-control" id="address">
        </div>
        <div class="mb-3">
            <label for="dob" class="form-label">Date of Birth</label>
            <input type="date" class="form-control" id="dob" required>
        </div>
        <div id="formError" class="text-danger mb-3" style="white-space: pre-wrap;"></div>

        <button type="button" class="btn btn-primary" onclick="updateStudent()">Update Student</button>
        <a href="/students.html" class="btn btn-secondary">Back to List</a>
    </form>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const nim = urlParams.get('nim');

        if (!nim) {
            alert('No student specified');
            window.location.href = '/students.html';
        }

        // Fetch student details
        fetch(`/students/${nim}`)
            .then(response => {
                if (!response.ok) throw new Error('Failed to fetch student');
                return response.json();
            })
            .then(student => {
                document.getElementById('nim').value = student.nim;
                document.getElementById('fullName').value = student.fullName;
                document.getElementById('address').value = student.address;
                document.getElementById('dob').value = student.dob;
            })
            .catch(error => {
                alert(error.message);
                window.location.href = '/students.html';
            });

        function updateStudent() {
            const fullName = document.getElementById('fullName').value;
            const address = document.getElementById('address').value;
            const dob = document.getElementById('dob').value;
            const errorDiv = document.getElementById('formError');

            errorDiv.textContent = '';

            const studentData = {
                fullName: fullName,
                address: address,
                dob: dob
            };

            fetch(`/students/${nim}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(studentData)
            })
                .then(response => {
                    if (response.ok) {
                        alert('Student updated successfully!');
                        window.location.href = '/students.html';
                    } else {
                        return response.json().then(data => {
                            if (data.errors) {
                                let errorMessage = "Validation failed:\n";
                                for (const [field, message] of Object.entries(data.errors)) {
                                    errorMessage += `- ${message}\n`;
                                }
                                throw new Error(errorMessage);
                            }
                            throw new Error(data.message || 'Failed to update student');
                        });
                    }
                })
                .catch(error => {
                    errorDiv.textContent = error.message;
                });
        }
    </script>

</body>

</html>
